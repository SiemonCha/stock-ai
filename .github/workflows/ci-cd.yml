name: Stock AI CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Testing job
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-mock pytest-asyncio
        # Install core dependencies with relaxed versions for compatibility
        pip install tensorflow pandas numpy scikit-learn || true
        pip install torch transformers xgboost lightgbm catboost || true
        pip install yfinance alpha_vantage requests websocket-client python-binance || true
        pip install ta scipy statsmodels || true
        pip install fastapi uvicorn pydantic websockets python-multipart PyJWT aiohttp || true
        pip install pytest pytest-cov pytest-mock pytest-asyncio || true
        pip install redis matplotlib seaborn plotly || true
        pip install sqlalchemy psycopg2-binary pymongo || true
        pip install python-dotenv joblib tqdm schedule APScheduler || true
        pip install flake8 black isort mypy bandit || true
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
    
    - name: Run linting
      run: |
        pip install flake8 black isort mypy
        flake8 src/ api/ --count --select=E9,F63,F7,F82 --show-source --statistics --extend-ignore=F824
        black --check src/ api/ || true
        isort --check-only --diff src/ api/ || true
    
    - name: Type checking
      run: |
        mypy src/ --ignore-missing-imports || true
    
    - name: Security check
      run: |
        pip install bandit
        bandit -r src/ api/ -ll || true

  # Build and push Docker image (disabled - too slow for CI/CD)
  # Re-enable by changing 'false' to appropriate condition
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: false  # Disabled - Docker build takes too long with ML dependencies
    continue-on-error: true

    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

  # Deploy to staging (disabled - requires infrastructure)
  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: false  # Disabled - requires deployment infrastructure
    environment: staging
    
    steps:
    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment..."
        # Add your deployment commands here
        # Example: kubectl apply -f k8s/staging/
        # Or: docker-compose -f docker-compose.staging.yml up -d
    
    - name: Run integration tests
      run: |
        echo "🧪 Running integration tests..."
        # Add integration test commands here
    
    - name: Notify Slack
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # Deploy to production (disabled - requires infrastructure)
  deploy-production:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: false  # Disabled - requires deployment infrastructure
    environment: production
    
    steps:
    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production environment..."
        # Add your production deployment commands here
        # Example: kubectl apply -f k8s/production/
        # Or: helm upgrade stock-ai ./helm-chart
    
    - name: Run smoke tests
      run: |
        echo "🧪 Running production smoke tests..."
        # Add smoke test commands here
        # curl -f https://api.yourdomain.com/health
    
    - name: Notify team
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#releases'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    continue-on-error: true  # Don't fail CI for security warnings

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      continue-on-error: true
      with:
        scan-type: 'fs'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'  # Only report critical/high issues
        exit-code: '0'  # Don't fail on vulnerabilities

    - name: Upload Trivy scan results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      continue-on-error: true
      with:
        sarif_file: 'trivy-results.sarif'