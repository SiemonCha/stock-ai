version: '3.8'

services:
  # Main Stock AI Dashboard
  dashboard:
    build: .
    container_name: stock-ai-dashboard
    ports:
      - "8050:8050"
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - redis
    networks:
      - stockai-net

  # Redis for caching data
  redis:
    image: redis:alpine
    container_name: stock-ai-redis
    ports:
      - "6379:6379"
    networks:
      - stockai-net

networks:
  stockai-net:
    driver: bridge