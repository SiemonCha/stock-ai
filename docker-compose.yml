version: '3.8'

services:
  # Stock AI Dashboard Service
  stockai-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: stockai-dashboard
    restart: unless-stopped
    ports:
      - "8050:8050"  # Dashboard port
      - "8000:8000"  # API port
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      - redis
      - postgres
    networks:
      - stockai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Model Training Service
  stockai-training:
    build:
      context: .
      dockerfile: Dockerfile.training
    container_name: stockai-training
    restart: "no"  # Run on-demand
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379
      - GPU_ENABLED=false
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - redis
      - postgres
    networks:
      - stockai-network
    profiles:
      - training

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: stockai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - stockai-network
    command: redis-server --appendonly yes

  # PostgreSQL for data storage
  postgres:
    image: postgres:15-alpine
    container_name: stockai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=stockai
      - POSTGRES_USER=stockai
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - stockai-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: stockai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/ssl/certs:ro
    depends_on:
      - stockai-api
    networks:
      - stockai-network

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  stockai-network:
    driver: bridge