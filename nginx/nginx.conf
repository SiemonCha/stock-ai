events {
    worker_connections 1024;
}

http {
    upstream stockai_dashboard {
        server stockai-dashboard-1:8050;
        server stockai-dashboard-2:8050;
        keepalive 32;
    }
    
    upstream stockai_api {
        server stockai-dashboard-1:8000;
        server stockai-dashboard-2:8000;
        keepalive 32;
    }
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=dashboard_limit:10m rate=30r/s;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    
    server {
        listen 80;
        server_name localhost;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        
        # Dashboard
        location / {
            limit_req zone=dashboard_limit burst=20 nodelay;
            proxy_pass http://stockai_dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # API
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://stockai_api;
            proxy_set_header Host $host;
        }
        
        # Health check
        location /health {
            proxy_pass http://stockai_dashboard;
        }
    }
}